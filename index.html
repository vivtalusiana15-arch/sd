async function api(action,payload={},write=false){
 if(!configured())throw Error("URL API belum diisi. Data belum dapat dimuat atau disimpan.");
 try{
  const url=write?API_URL:new URL(API_URL);
  if(!write){url.searchParams.set("action",action);Object.entries(payload).forEach(([k,v])=>url.searchParams.set(k,String(v??"")))}
  const response=await fetch(String(url),write?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,...payload})}:{method:"GET",cache:"no-store"});
  if(!response.ok)throw Error("Server mengembalikan HTTP "+response.status);
  const result=await response.json();
  if(!result || result.success!==true)throw Error(result?.message||"Respons API tidak berhasil.");
  return result.data;
 }catch(e){if(e instanceof TypeError)throw Error("Koneksi gagal. Periksa internet, URL deployment, dan izin akses API.");throw e}
}

function fieldHtml([key,label,kind,required],value){let id="form-"+key,req=required?"required":"";let input=kind==="class"||kind==="teacher"||kind==="subject"?`<select id="${id}" name="${key}" ${req}>${option(state.lists[kind==="class"?"classes":kind==="teacher"?"teachers":"subjects"],value)}</select>`:kind==="selectLevel"?`<select id="${id}" name="${key}" required><option value="">Pilih tingkat</option>${["I","II","III","IV","V","VI"].map(x=>`<option ${x===String(value)?"selected":""}>${x}</option>`).join("")}</select>`:`<input id="${id}" name="${key}" type="${kind}" value="${esc(value)}" ${req} ${kind==="number"?'min="0" max="100" step="1"':''}>`;return `<div class="field"><label for="${id}">${label}${required?" *":""}</label>${input}</div>`}

function validateRecord(type,data,id){let items=state.lists[type],duplicate=(key,val)=>val&&items.some(x=>String(x.id)!==String(id)&&String(x[key]??"").trim().toLowerCase()===String(val).trim().toLowerCase());if(type==="students"){if(!/^\d{1,20}$/.test(data.nis)){toast("NIS harus berisi 1–20 digit angka.",true);return false}if(data.nisn&&!/^\d{10}$/.test(data.nisn)){toast("NISN harus berisi tepat 10 digit angka.",true);return false}if(duplicate("nis",data.nis)||duplicate("nisn",data.nisn)){toast("NIS atau NISN sudah terdaftar.",true);return false}}if(type==="teachers"&&duplicate("nip",data.nip)||type==="classes"&&items.some(x=>String(x.id)!==String(id)&&x.name?.toLowerCase()===data.name.toLowerCase()&&x.schoolYear===data.schoolYear)||type==="subjects"&&duplicate("name",data.name)){toast("Data yang sama sudah terdaftar.",true);return false}if(type==="subjects"&&(Number(data.kktp)<0||Number(data.kktp)>100)){toast("KKTP harus antara 0 dan 100.",true);return false}return true}

function weights(){return state.grades?.weights||{daily:30,tp:30,material:20,final:20}}
function calcGrade(r){let w=weights(),tps=gradeTps(),tpVals=tps.map(t=>Number(r.tp?.[t.id])).filter(Number.isFinite).filter(x=>x>=0&&x<=100),tpAvg=tpVals.length?tpVals.reduce((a,b)=>a+b,0)/tpVals.length:0;let fields=[r.daily,tpVals.length?tpAvg:null,r.material,r.semesterFinal],ww=[+w.daily,+w.tp,+w.material,+w.final],active=fields.map((x,i)=>x!==null&&x!==undefined&&x!==""?i:-1).filter(i=>i>=0),totalWeight=active.reduce((a,i)=>a+ww[i],0);if(!totalWeight)return {score:"",predicate:"",note:""};let score=Math.round(active.reduce((a,i)=>a+Number(fields[i])*ww[i],0)/totalWeight*100)/100;let kktp=Number(state.grades?.kktp??state.lists.subjects.find(s=>String(s.id)===String(state.filter.subjectId))?.kktp??75);return {score,predicate:score>=90?"A":score>=80?"B":score>=kktp?"C":"D",note:score>=kktp?"Tuntas":"Belum tuntas"}}
function renderGrades(){let rows=gradeRows(),tps=gradeTps(),w=weights();return heading("Daftar Nilai","Kelola nilai harian, tujuan pembelajaran, dan asesmen semester.",`<button id="save-grades" class="btn primary canva-button"><i data-lucide="save"></i>Simpan Nilai</button>`)+`<div class="panel canva-panel"><div class="filters">${classSelect("grade-class",state.filter.classId)}<div class="field"><label for="grade-subject">Mata pelajaran</label><select id="grade-subject">${option(state.lists.subjects,state.filter.subjectId)}</select></div><div class="field"><label for="grade-semester">Semester</label><select id="grade-semester"><option ${state.filter.semester==="Ganjil"?"selected":""}>Ganjil</option><option ${state.filter.semester==="Genap"?"selected":""}>Genap</option></select></div><button id="load-grades" class="btn canva-button"><i data-lucide="refresh-cw"></i>Muat nilai</button><button id="add-tp" class="btn canva-button"><i data-lucide="plus"></i>Tambah TP</button></div><div class="filters" style="margin-top:17px">${[["daily","Harian"],["tp","TP"],["material","Lingkup materi"],["final","Akhir semester"]].map(([k,l])=>`<div class="field compact"><label for="weight-${k}">Bobot ${l} (%)</label><input class="weight-input" id="weight-${k}" data-key="${k}" type="number" min="0" max="100" value="${esc(w[k])}"></div>`).join("")}<div class="field compact"><label for="grade-kktp">KKTP</label><input id="grade-kktp" type="number" min="0" max="100" value="${esc(state.grades?.kktp??state.lists.subjects.find(s=>String(s.id)===String(state.filter.subjectId))?.kktp??75)}"></div></div><p class="section-note">Bobot harus berjumlah 100%. Nilai akhir dihitung dari komponen yang terisi; kolom kosong tidak dianggap nol. Kosongkan input untuk menghapus nilai.</p></div><div class="panel canva-panel">${rows.length?`<div class="table-wrap"><table class="grade-table canva-table"><thead><tr><th rowspan="2">No</th><th rowspan="2" class="name-col">Nama siswa</th><th rowspan="2">Nilai Harian</th><th colspan="${Math.max(1,tps.length)}">Tujuan Pembelajaran (TP)</th><th rowspan="2">Sumatif Lingkup Materi</th><th rowspan="2">Sumatif Akhir Semester</th><th rowspan="2">Nilai Akhir</th><th rowspan="2">Predikat</th><th rowspan="2">Keterangan</th></tr><tr>${tps.length?tps.map((t,i)=>`<th><input class="inline-input tp-name" data-index="${i}" aria-label="Nama TP ${i+1}" value="${esc(t.name)}"><button class="btn small danger canva-button remove-tp" data-index="${i}" type="button" aria-label="Hapus TP ${i+1}">×</button></th>`).join(""):"<th>Belum ada TP</th>"}</tr></thead><tbody>${rows.map((r,i)=>{let result=calcGrade(r);return `<tr data-grade-student="${esc(r.student.id)}"><td>${i+1}</td><td>${esc(r.student.name)}</td><td>${scoreInput("daily",r.daily,r.student.name)}</td>${tps.length?tps.map(t=>`<td>${scoreInput("tp:"+t.id,r.tp?.[t.id],r.student.name)}</td>`).join(""):"<td>—</td>"}<td>${scoreInput("material",r.material,r.student.name)}</td><td>${scoreInput("semesterFinal",r.semesterFinal,r.student.name)}</td><td class="final-score">${esc(result.score)}</td><td class="predicate">${esc(result.predicate)}</td><td class="grade-note">${esc(result.note)}</td></tr>`}).join("")}</tbody></table></div>`:empty("Belum ada siswa pada kelas ini","Pilih kelas yang memiliki siswa untuk mengisi nilai.")}</div>`}
function scoreInput(key,value,name){return `<input type="number" min="0" max="100" step="0.01" class="inline-input score-input" data-key="${esc(key)}" aria-label="${esc(key)} ${esc(name)}" value="${esc(value??"")}">`}
function collectGrades(){return [...document.querySelectorAll("[data-grade-student]")].map(tr=>{let r={studentId:tr.dataset.gradeStudent,tp:{}};tr.querySelectorAll(".score-input").forEach(input=>{let value=input.value===""?null:Number(input.value),key=input.dataset.key;if(key.startsWith("tp:"))r.tp[key.slice(3)]=value;else r[key]=value});return r})}
function syncGrades(){if(!state.grades)state.grades={rows:[],tpColumns:[],weights:weights()};state.grades.rows=collectGrades();state.grades.tpColumns=gradeTps().map((t,i)=>({...t,name:$(`.tp-name[data-index="${i}"]`)?.value||t.name}));state.grades.kktp=Number($("#grade-kktp")?.value||75);state.grades.weights=Object.fromEntries([...document.querySelectorAll(".weight-input")].map(x=>[x.dataset.key,Number(x.value)]))}
function recalcGrades(){syncGrades();document.querySelectorAll("[data-grade-student]").forEach(tr=>{let r=arr(state.grades.rows).find(x=>String(x.studentId)===tr.dataset.gradeStudent),c=calcGrade(r);$(".final-score",tr).textContent=c.score;$(".predicate",tr).textContent=c.predicate;$(".grade-note",tr).textContent=c.note})}
async function loadGrades(){if(!state.filter.classId||!state.filter.subjectId){toast("Pilih kelas dan mata pelajaran.",true);return}let data=await load("getGrades",{classId:state.filter.classId,subjectId:state.filter.subjectId,semester:state.filter.semester,schoolYear:state.settings.schoolYear});state.grades=data||{rows:[],tpColumns:[],weights:{daily:30,tp:30,material:20,final:20}};render()}
function renderSettings(){let keys=[["schoolName","Identitas sekolah"],["headName","Nama kepala sekolah"],["headNip","NIP kepala sekolah"],["teacherName","Nama guru"],["teacherNip","NIP guru"],["schoolYear","Tahun pelajaran"],["semester","Semester"],["letterhead","Kop dokumen (teks tambahan)"],["signatureText","Teks area tanda tangan"]];return heading("Pengaturan","Identitas sekolah, dokumen, dan referensi administrasi.")+`<div class="panel canva-panel"><h3>Identitas & dokumen</h3><form id="settings-form"><div class="form-grid">${keys.map(([k,label])=>`<div class="field"><label for="setting-${k}">${label}</label>${k==="semester"?`<select id="setting-${k}" name="${k}"><option ${state.settings[k]==="Ganjil"?"selected":""}>Ganjil</option><option ${state.settings[k]==="Genap"?"selected":""}>Genap</option></select>`:`<input id="setting-${k}" name="${k}" value="${esc(state.settings[k])}" ${k==="schoolName"||k==="schoolYear"?"required":""}>`}</div>`).join("")}</div><div class="button-row" style="margin-top:20px"><button type="submit" class="btn primary canva-button"><i data-lucide="save"></i>Simpan pengaturan</button></div></form></div><div class="panel canva-panel"><h3>Data referensi</h3><p class="muted">Nama siswa, kelas, dan mata pelajaran diedit langsung pada modul masing-masing agar perubahan mengikuti data sumber yang sama.</p><div class="button-row"><button class="btn canva-button" data-page="students">Kelola siswa</button><button class="btn canva-button" data-page="classes">Kelola kelas</button><button class="btn canva-button" data-page="subjects">Kelola mata pelajaran</button></div></div>`}
function renderPrint(){return heading("Cetak Administrasi","Pratinjau dokumen resmi; hanya dokumen ini yang dicetak.")+`<div class="panel canva-panel"><div class="filters"><div class="field"><label for="print-type">Dokumen</label><select id="print-type"><option value="attendance" ${state.filter.docType==="attendance"?"selected":""}>Daftar hadir siswa</option><option value="grades" ${state.filter.docType==="grades"?"selected":""}>Daftar nilai semester</option></select></div>${classSelect("print-class",state.filter.classId)}${state.filter.docType==="attendance"?monthSelect("print-month",state.filter.month):`<div class="field"><label for="print-subject">Mata pelajaran</label><select id="print-subject">${option(state.lists.subjects,state.filter.subjectId)}</select></div><div class="field"><label for="print-semester">Semester</label><select id="print-semester"><option ${state.filter.semester==="Ganjil"?"selected":""}>Ganjil</option><option ${state.filter.semester==="Genap"?"selected":""}>Genap</option></select></div>`}<button id="preview-load" class="btn canva-button"><i data-lucide="refresh-cw"></i>Muat data</button><button id="print-now" class="btn primary canva-button"><i data-lucide="printer"></i>Cetak / PDF</button><button id="export-excel" class="btn canva-button"><i data-lucide="sheet"></i>Ekspor CSV Excel</button></div><p class="section-note">Pilih “Simpan sebagai PDF” pada dialog cetak untuk menghasilkan PDF. Ukuran kertas: F4/Folio, lanskap.</p></div><div class="preview-shell"><div id="preview-sheet" class="preview-sheet">${documentHtml()}</div></div>`}
function documentHtml(){let isAtt=state.filter.docType==="attendance",rows=isAtt?attendanceRows():gradeRows(),tps=gradeTps(),school=state.settings.schoolName||"SD NEGERI KESILIR 02",cls=nameOf("classes",state.filter.classId),subject=nameOf("subjects",state.filter.subjectId);return `<div class="doc-header"><strong>${esc(state.settings.letterhead||"")}</strong><h2>${esc(school)}</h2></div><div class="doc-title"><h2>${isAtt?"DAFTAR HADIR SISWA SD NEGERI KESILIR 02":"DAFTAR NILAI SEMESTER"}</h2>${isAtt?"":`<div>SD NEGERI KESILIR 02</div>`}<div>TAHUN PELAJARAN ${esc(state.settings.schoolYear)}</div></div><div class="doc-meta"><span>KELAS : ${esc(cls)}</span><span>${isAtt?"BULAN : "+esc(months[Number(state.filter.month)-1]):"MATA PELAJARAN : "+esc(subject)+" &nbsp; | &nbsp; SEMESTER : "+esc(state.filter.semester)}</span></div><table class="doc-table"><thead>${isAtt?`<tr><th>No</th><th>Nama siswa</th>${Array.from({length:31},(_,i)=>`<th>${i+1}</th>`).join("")}<th>S</th><th>I</th><th>A</th><th>Jml</th><th>Ket</th></tr>`:`<tr><th rowspan="2">No</th><th rowspan="2">Nama siswa</th><th rowspan="2">Nilai Harian</th><th colspan="${Math.max(1,tps.length)}">TP</th><th rowspan="2">Sumatif Lingkup Materi</th><th rowspan="2">Sumatif Akhir Semester</th><th rowspan="2">Nilai Akhir</th><th rowspan="2">Predikat</th><th rowspan="2">Keterangan</th></tr><tr>${tps.length?tps.map(t=>`<th>${esc(t.name)}</th>`).join(""):"<th>—</th>"}</tr>`}</thead><tbody>${rows.map((r,i)=>isAtt?`<tr><td>${i+1}</td><td>${esc(r.student.name)}</td>${Array.from({length:31},(_,j)=>`<td>${j+1<=dayCount()?esc(attStatus(r,j+1)):""}</td>`).join("")}${counts(r).map(n=>`<td>${n}</td>`).join("")}<td>${counts(r).reduce((a,b)=>a+b,0)}</td><td>${esc(r.note)}</td></tr>`:`<tr><td>${i+1}</td><td>${esc(r.student.name)}</td><td>${esc(r.daily)}</td>${tps.length?tps.map(t=>`<td>${esc(r.tp?.[t.id])}</td>`).join(""):"<td>—</td>"}<td>${esc(r.material)}</td><td>${esc(r.semesterFinal)}</td><td>${esc(calcGrade(r).score)}</td><td>${esc(calcGrade(r).predicate)}</td><td>${esc(calcGrade(r).note)}</td></tr>`).join("")}</tbody></table>${rows.length?"":`<p style="text-align:center">Belum ada data untuk periode ini.</p>`}<div class="signatures"><div>Mengetahui,<br>Kepala Sekolah<div class="space"></div><strong>${esc(state.settings.headName||"________________________")}</strong><br>NIP. ${esc(state.settings.headNip||"—")}</div><div>${esc(state.settings.signatureText||"Guru Kelas")}<div class="space"></div><strong>${esc(state.settings.teacherName||"________________________")}</strong><br>NIP. ${esc(state.settings.teacherNip||"—")}</div></div>`}
function renderBackup(){return heading("Backup Data","Ambil salinan data dari API atau pulihkan backup yang valid.")+`<div class="grid-two"><div class="panel canva-panel"><h3>Unduh backup</h3><p class="muted">Backup diambil langsung dari API, bukan dari cache browser.</p><div class="button-row"><button id="backup-json" class="btn primary canva-button"><i data-lucide="download"></i>Unduh JSON</button><button id="backup-csv" class="btn canva-button"><i data-lucide="sheet"></i>Unduh CSV</button></div></div><div class="panel canva-panel"><h3>Pulihkan data</h3><p class="muted">Pilih file JSON hasil backup. Periksa isinya sebelum mengirim ke API.</p><div class="field"><label for="restore-file">File backup JSON</label><input id="restore-file" type="file" accept=".json,application/json"></div><button id="restore-button" class="btn canva-button" style="margin-top:12px"><i data-lucide="upload"></i>Validasi & pulihkan</button></div></div>`}
function download(name,text,mime){let blob=new Blob(["\uFEFF",text],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function csv(rows){if(!rows.length)return "";let keys=[...new Set(rows.flatMap(r=>Object.keys(r)))];const cell=v=>`"${String(typeof v==="object"?JSON.stringify(v):v??"").replace(/"/g,'""')}"`;return [keys.map(cell).join(","),...rows.map(r=>keys.map(k=>cell(r[k])).join(","))].join("\r\n")}
async function backup(format){let data=await load("backup");if(data===null)return;if(format==="json")download("backup-administrasi-kesilir-02.json",JSON.stringify(data,null,2),"application/json");else{let sections=Object.entries(data).filter(([,v])=>Array.isArray(v));if(!sections.length){toast("API tidak mengembalikan kumpulan baris untuk CSV.",true);return}download("backup-administrasi-kesilir-02.csv",sections.map(([key,rows])=>`"${key}"\r\n${csv(rows)}`).join("\r\n\r\n"),"text/csv")}}
function exportDocument(){let rows=state.filter.docType==="attendance"?attendanceRows().map(r=>{let [s,i,a]=counts(r);return {No:"",Nama:r.student.name,...Object.fromEntries(Array.from({length:31},(_,j)=>["Tanggal "+(j+1),attStatus(r,j+1)])),S:s,I:i,A:a,Jml:s+i+a,Ket:r.note||""}}):gradeRows().map(r=>({Nama:r.student.name,"Nilai Harian":r.daily,...Object.fromEntries(gradeTps().map(t=>[t.name,r.tp?.[t.id]??""])),"Sumatif Lingkup Materi":r.material,"Sumatif Akhir Semester":r.semesterFinal,"Nilai Akhir":calcGrade(r).score,Predikat:calcGrade(r).predicate,Keterangan:calcGrade(r).note}));if(!rows.length){toast("Tidak ada data dokumen untuk diekspor.",true);return}download("administrasi-kesilir-02.csv",csv(rows),"text/csv")}
async function refreshAll(){if(!configured()){render();return}setBusy(true);try{let results=await Promise.allSettled([api("getStudents"),api("getTeachers"),api("getClasses"),api("getSubjects"),api("getSettings"),api("getDashboard")]);["students","teachers","classes","subjects"].forEach((k,i)=>{if(results[i].status==="fulfilled")state.lists[k]=arr(results[i].value)});if(results[4].status==="fulfilled"&&results[4].value)state.settings={...state.settings,...results[4].value};if(results[5].status==="fulfilled")state.dashboard=results[5].value;let errors=results.filter(x=>x.status==="rejected");if(errors.length)toast(`${errors.length} bagian gagal dimuat. Periksa koneksi atau kontrak API.`,true);else toast("Data berhasil dimuat.");if(!state.filter.classId)state.filter.classId=state.lists.classes.find(x=>x.level==="VI"||String(x.name).toUpperCase().includes("VI"))?.id||""}finally{setBusy(false);render()}}
$("#navigation").addEventListener("click",e=>{let b=e.target.closest("[data-page]");if(b)show(b.dataset.page)});
$("#content").addEventListener("click",async e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.page){show(b.dataset.page);return}let p=state.page,id=b.dataset.edit||b.dataset.delete;if(b.id==="add-record")editRecord(p);else if(b.dataset.edit)editRecord(p,id);else if(b.dataset.delete)deleteRecord(p,id);else if(b.id==="refresh-list")refreshList(p);else if(b.id==="load-attendance")loadAttendance();else if(b.id==="save-attendance"){if(!state.filter.classId){toast("Pilih kelas.",true);return}let holidays=$("#holidays").value,effectiveDays=$("#effective-days").value;if(holidays&&!holidays.split(",").every(x=>/^\s*(?:[1-9]|[12]\d|3[01])\s*$/.test(x))){toast("Tanggal libur harus berupa angka 1–31 dipisahkan koma.",true);return}await write("saveAttendance",{classId:state.filter.classId,month:state.filter.month,schoolYear:state.settings.schoolYear,effectiveDays:effectiveDays===""?null:Number(effectiveDays),holidays,rows:collectAttendance()})}else if(b.id==="load-grades")loadGrades();else if(b.id==="add-tp"){syncGrades();state.grades.tpColumns.push({id:"tp_"+Date.now(),name:"TP "+(state.grades.tpColumns.length+1)});render()}else if(b.classList.contains("remove-tp")){syncGrades();let removed=state.grades.tpColumns.splice(Number(b.dataset.index),1)[0];state.grades.rows.forEach(r=>delete r.tp?.[removed.id]);render()}else if(b.id==="save-grades"){recalcGrades();let sum=Object.values(state.grades.weights).reduce((a,v)=>a+Number(v),0);if(sum!==100){toast("Jumlah bobot harus tepat 100%.",true);return}if([...document.querySelectorAll(".score-input")].some(x=>x.value!==""&&(Number(x.value)<0||Number(x.value)>100))){toast("Nilai harus antara 0 dan 100.",true);return}if(!state.filter.classId||!state.filter.subjectId){toast("Pilih kelas dan mata pelajaran.",true);return}await write("saveGrades",{classId:state.filter.classId,subjectId:state.filter.subjectId,semester:state.filter.semester,schoolYear:state.settings.schoolYear,...state.grades})}else if(b.id==="load-recap"){let isAtt=state.page==="attendanceRecap",action=isAtt?"getAttendanceRecap":"getGradeRecap",data=await load(action,{classId:state.filter.classId,month:state.filter.month,subjectId:state.filter.subjectId,semester:state.filter.semester,schoolYear:state.settings.schoolYear});if(data!==null){if(isAtt)state.attendanceRecap=data;else state.gradeRecap=data;render()}}else if(b.id==="preview-load"){if(state.filter.docType==="attendance")await loadAttendance();else await loadGrades();render()}else if(b.id==="print-now"){if(!state.filter.classId){toast("Pilih kelas sebelum mencetak.",true);return}$("#print-document").innerHTML=documentHtml();window.print()}else if(b.id==="export-excel")exportDocument();else if(b.id==="backup-json")backup("json");else if(b.id==="backup-csv")backup("csv");else if(b.id==="restore-button"){let file=$("#restore-file").files[0];if(!file){toast("Pilih file JSON terlebih dahulu.",true);return}if(file.size>10*1024*1024){toast("File melebihi batas 10 MB.",true);return}try{let data=JSON.parse(await file.text());if(!data||typeof data!=="object"||Array.isArray(data)||!Object.keys(data).length)throw Error("Struktur JSON tidak valid.");modal("Konfirmasi restore",`<p>File <strong>${esc(file.name)}</strong> telah lolos validasi dasar. Restore dapat mengubah data pada Google Sheets. Lanjutkan?</p><div class="modal-actions"><button id="cancel-modal" class="btn canva-button">Batal</button><button id="confirm-restore" class="btn danger canva-button">Ya, pulihkan</button></div>`);$("#cancel-modal").onclick=closeModal;$("#confirm-restore").onclick=async()=>{let r=await write("restore",{data});if(r.ok){closeModal();await refreshAll()}}}catch(err){toast(err.message,true)}}});
$("#content").addEventListener("input",e=>{let t=e.target;if(t.id==="crud-search"){state.filter.search=t.value;let pos=t.selectionStart;render();$("#crud-search").focus();$("#crud-search").setSelectionRange(pos,pos)}if(t.classList.contains("att-cell"))updateAttCounts(t.closest("tr"));if(t.classList.contains("score-input")||t.classList.contains("weight-input")||t.id==="grade-kktp")recalcGrades()});
$("#content").addEventListener("change",e=>{let t=e.target,ids={"crud-class":"crudClass","att-class":"classId","att-month":"month","grade-class":"classId","grade-subject":"subjectId","grade-semester":"semester","recap-class":"classId","recap-month":"month","recap-subject":"subjectId","recap-semester":"semester","print-class":"classId","print-month":"month","print-subject":"subjectId","print-semester":"semester","print-type":"docType"};if(ids[t.id]){state.filter[ids[t.id]]=t.value;if(t.id==="crud-class")render();else if(t.id==="print-type")render();else if(t.id.startsWith("print-")){$("#preview-sheet").innerHTML=documentHtml()}else if(t.id.startsWith("att-")){state.attendance=null;render()}else if(t.id.startsWith("grade-")){state.grades=null;render()}}if(t.id==="effective-days")state.filter.effectiveDays=t.value;if(t.id==="holidays")state.filter.holidays=t.value;if(t.classList.contains("tp-name"))syncGrades()});
$("#content").addEventListener("submit",async e=>{if(e.target.id!=="settings-form")return;e.preventDefault();let settings=Object.fromEntries(new FormData(e.target));if(!/^\d{4}\/\d{4}$/.test(settings.schoolYear)){toast("Tahun pelajaran harus berbentuk 2026/2027.",true);return}let result=await write("saveSettings",{settings});if(result.ok){state.settings={...state.settings,...settings};render()}});
$("#modal-close").onclick=closeModal;$("#modal-backdrop").onclick=e=>{if(e.target.id==="modal-backdrop")closeModal()};document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});$("#menu-toggle").onclick=()=>$("#sidebar").classList.toggle("open");$("#reload-button").onclick=refreshAll;
show("dashboard");if(configured())refreshAll();
