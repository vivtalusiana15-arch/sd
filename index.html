  async function write(type,key,obj,button){if(!ready)return toast("Tunggu hingga data selesai dimuat.");let existing=get(type,key);if(!existing&&rows.length>=999)return toast("Batas 999 baris Canva Sheet tercapai. Cadangkan dan kurangi data.");if(button){button.disabled=true}status("Menyimpan…");try{let record={entity_type:type,entity_key:key,payload:JSON.stringify(obj),updated_at:new Date().toISOString()};let res=existing?await window.dataSdk.update({...existing,...record}):await window.dataSdk.create(record);if(!res.isOk){toast("Penyimpanan belum dapat dikonfirmasi. Muat ulang sebelum mencoba lagi.");status("Periksa penyimpanan");return false}status("Terakhir disimpan "+new Date().toLocaleTimeString("id-ID"));toast("Data berhasil disimpan.");return true}catch(e){toast("Penyimpanan gagal. Periksa koneksi Anda.");status("Gagal menyimpan");return false}finally{if(button)button.disabled=false}}

  function counts(s,m=selectedMonth,y=selectedYear){let v=effective("attendance",attendanceKey(s,m,y)).days||{};let out={H:0,S:0,I:0,A:0};for(let d=1;d<=daysIn(m,y);d++)if(!isHoliday(d,m,y)&&out[v[d]]!==undefined)out[v[d]]++;let effectiveDays=Number(settings().effective)||Array.from({length:daysIn(m,y)},(_,i)=>i+1).filter(d=>!isHoliday(d,m,y)).length;return {...out,absent:out.S+out.I+out.A,percent:effectiveDays?Math.round(out.H/effectiveDays*100):0}}

adeNums.length} · Rata-rata: ${gradeNums.length?(gradeNums.reduce((a,b)=>a+b,0)/gradeNums.length).toFixed(1):"0"}</p></div><div class="panel canva-panel"><h2>Grafik kehadiran bulanan</h2><div class="chart" aria-label="Grafik jumlah hadir tiap bulan">${bars}</div><p class="hint" style="margin-top:30px">Jumlah tanda hadir dalam tahun pelajaran aktif.</p></div><div class="panel canva-panel"><h2>Perkembangan nilai</h2><p class="hint">${gradeNums.length?`Rata-rata seluruh komponen nilai terisi: ${(gradeNums.reduce((a,b)=>a+b,0)/gradeNums.length).toFixed(1)} · Nilai tertinggi ${Math.max(...gradeNums)} · terendah ${Math.min(...gradeNums)}.`:"Belum ada nilai. Masukkan nilai pada Daftar Nilai Siswa untuk melihat ringkasan."}</p><div class="chart"><div class="chartbar" style="height:${gradeNums.length?Math.max(2,gradeNums.reduce((a,b)=>a+b,0)/gradeNums.length):2}%;max-width:85px"><span>Rata-rata</span></div></div></div></div>`}

  function crudPage(id){let c=configs[id],all=items(c.type);let filtered=all.filter(x=>(id!=="students"||!selectedClass||selectedClass==="Semua kelas"||x.className===selectedClass)&&(!filter||Object.values(x).some(v=>String(v).toLowerCase().includes(filter.toLowerCase()))));let edit=editing?.type===c.type?editing.data:null;return `${header(c.title,"Kelola data dan relasi sekolah.")}<div class="panel canva-panel"><h2>${edit?"Edit":"Tambah"} ${c.title.replace("Data ","")}</h2><form id="crud-form"><div class="formgrid">${c.columns.map(([key,label])=>key==="gender"?choice("f-"+key,label,["Laki-laki","Perempuan"],edit?.[key]):key==="status"?choice("f-"+key,label,id==="students"?["Aktif","Tidak aktif"]:["Aktif","Tidak aktif"],edit?.[key]||"Aktif"):key==="className"?choice("f-"+key,label,classes().map(x=>x.name),edit?.[key]):field("f-"+key,label,edit?.[key]||"",key==="birthDate"?"date":"text",["name","nis"].includes(key)&&id==="students"?"required":key==="name"?"required":"")).join("")}</div><button type="submit" class="btn primary canva-button">${edit?"Simpan perubahan":"Tambah data"}</button> ${edit?'<button type="button" id="cancel-edit" class="btn canva-button">Batal</button>':""}</form></div><div class="panel canva-panel"><div class="toolbar">${field("search","Cari",filter)}${id==="students"?choice("student-class","Filter kelas",classOptions(),selectedClass||"Semua kelas"):""}<button id="copy-csv" class="btn canva-button">Export CSV</button>${id==="students"?'<label class="btn canva-button" for="import-csv">Import CSV</label><input id="import-csv" type="file" accept=".csv,text/csv" class="hidden">':""}<button id="print-list" class="btn canva-button">Cetak</button></div><div class="tablewrap"><table class="canva-table"><thead><tr><th>No</th>${c.columns.map(x=>`<th>${x[1]}</th>`).join("")}<th class="no-print">Aksi</th></tr></thead><tbody>${filtered.length?filtered.map((x,i)=>`<tr><td>${i+1}</td>${c.columns.map(([key])=>`<td>${esc(x[key])}</td>`).join("")}<td class="no-p   function bindCrud(id){let c=configs[id];$("#crud-form").onsubmit=async e=>{e.preventDefault();let obj={};c.columns.forEach(([k])=>obj[k]=$("#f-"+k).value.trim());if(!obj.name)return toast("Nama wajib diisi.");let key=editing?.type===c.type?editing.key:uid();let ok=await write(c.type,key,obj,e.submitter);if(ok){editing=null;render()}};$("#cancel-edit")?.addEventListener("click",()=>{editing=null;render()});$("#search").oninput=e=>{filter=e.target.value;let start=e.target.selectionStart;render();$("#search").focus();$("#search").setSelectionRange(start,start)};$("#student-class")?.addEventListener("change",e=>{selectedClass=e.target.value;render()});document.querySelectorAll(".edit-row").forEach(b=>b.onclick=()=>{editing={type:c.type,key:b.dataset.key,data:items(c.type).find(x=>x._key===b.dataset.key)};render();window.scrollTo({top:0,behavior:"smooth"})});document.querySelectorAll(".delete-row").forEach(b=>b.onclick=()=>confirmAction("Hapus data?","Data ini akan dihapus. Riwayat absensi dan nilai siswa tetap tersimpan berdasarkan ID.",async()=>{if(await remove(c.type,b.dataset.key))render()}));$("#copy-csv").onclick=()=>showExport(csv([c.columns.map(x=>x[1]),...allData(c.type).map(x=>c.columns.map(([k])=>x[k]||""))]),"CSV "+c.title);$("#print-list").onclick=()=>window.print();$("#import-csv")?.addEventListener("change",importStudents)}

  function attendance(){let s=filteredStudents(),n=daysIn(selectedMonth,selectedYear);return `${header("Absensi Siswa","Klik sel tanggal untuk memilih H, S, I, A, atau kosong. Hari libur ditandai — dan tidak dihitung.")}<div class="panel canva-panel no-print"><div class="toolbar">${selectedControls()}${choice("filter-month","Bulan",months.map((_,i)=>i),selectedMonth)}${field("calendar-year","Tahun kalender",selectedYear,"number")}<div class="field"><label for="bulk-day">Tanggal massal</label><select id="bulk-day">${Array.from({length:n},(_,i)=>`<option>${i+1}</option>`).join("")}</select></div>${choice("bulk-status","Status",["H","S","I","A","Kosong"],"H")}<button id="apply-bulk" class="btn gold canva-button">Isi seluruh siswa</button></div><div class="toolbar"><button id="print-att" class="btn primary canva-button">Cetak Absensi / Simpan PDF</button><button id="print-all-months" class="btn canva-button">Cetak Semua Bulan</button><button id="print-semester-att" class="btn canva-button">Cetak Rekap Semester</button><button id="export-att" class="btn canva-button">Export CSV</button></div><p class="hint">Riwayat bulanan disimpan menurut siswa, kelas, tahun pelajaran, semester, bulan, dan tahun kalender. Tanggal libur diatur pada Pengaturan.</p></div><section id="print-area" class="panel print-panel"><div class="doc">${schoolHead("DAFTAR HADIR SISWA",`KELAS ${selectedClass||"—"} · BULAN ${months[selectedMonth].toUpperCase()} ${selectedYear} · SEMESTER ${selectedSemester}`)}<div class="tablewrap"><table class="canva-table"><thead><tr><th rowspan="2">No</th><th rowspan="2" class="name stickyname">Nama Siswa</th><th colspan="${n}">TANGGAL</th><th rowspan="2">S</th><th rowspan="2">I</th><th rowspan="2">A</th><th rowspan="2">Jml</th><th rowspan="2">Ket.</th></tr><tr>${Array.from({length:n},(_,i)=>`<th class="day">${i+1}</th>`).join("")}</tr></thead><tbody>${s.length?s.map((x,i)=>{let v=effective("attendance",attendanceKey(x)).days||{},c=counts(x);return `<tr><td>${i+1}</td><td class="name stickyname">${esc(x.name)}</td>${Array.from({length:n},(_,j)=>{let d=j+1;return `<td class="day" title="${isHoliday(d)?"Hari libur":"Tanggal "+d}">${isHoliday(d)?'<span>—</span>':`<select class="cell canva-dropdown attendance-cell" aria-label="${esc(x.name)} tanggal ${d}" data-student="${esc(x._key)}" data-day="${d}"><option value=""></option>${["H","S","I","A"].map(a=>`<option ${v[d]===a?"selected":""}>${a}</option>`).join("")}</select>`}</td>`}).join("")}<td>${c.S}</td><td>${c.I}</td><td>${c.A}</td><td>${c.absent}</td><td>${c.percent}%</td></tr>`}).join(""):`<tr><td colspan="${n+7}" class="empty">Belum ada siswa pada kelas ini. Tambahkan siswa melalui Data Siswa.</td></tr>`}</tbody></table></div>${signatures("attendance")}</div></section>`}
  function bindAttendance(){bindFilters(true);$("#calendar-year").onchange=e=>{selectedYear=Number(e.target.value);render()};document.querySelectorAll(".attendance-cell").forEach(el=>el.onchange=()=>{let s=students().find(x=>x._key===el.dataset.student);if(!s)return;let key=attendanceKey(s),d=el.dataset.day;let base=effective("attendance",key);let days={...(base.days||{})};if(el.value)days[d]=el.value;else delete days[d];queuedWrite("attendance",key,{studentId:s._key,className:selectedClass,schoolYear:settingsYear(),semester:selectedSemester,month:selectedMonth,year:selectedYear,days}).then(()=>{if(page==="attendance")render()})});$("#apply-bulk").onclick=e=>{let day=$("#bulk-day").value,val=$("#bulk-status").value;if(isHoliday(Number(day)))return toast("Tanggal ini ditandai sebagai hari libur.");let list=filteredStudents();if(!list.length)return toast("Belum ada siswa.");confirmAction("Isi absensi massal?",`Status tanggal ${day} akan diubah untuk ${list.length} siswa.`,async()=>{for(let s of list){let key=attendanceKey(s),base=effective("attendance",key),days={...(base.days||{})};if(val==="Kosong")delete days[day];else days[day]=val;await queuedWrite("attendance",key,{studentId:s._key,className:selectedClass,schoolYear:settingsYear(),semester:selectedSemester,month:selectedMonth,year:selectedYear,days})}render()})};$("#print-att").onclick=()=>window.print();$("#print-all-months").onclick=()=>printMonths();$("#print-semester-att").onclick=()=>{page="attendanceRecap";render();setTimeout(()=>window.print(),100)};$("#export-att").onclick=()=>{let n=daysIn(selectedMonth,selectedYear);showExport(csv([["No","Nama",...Array.from({length:n},(_,i)=>i+1),"H","S","I","A","Jumlah","Persentase"],...filteredStudents().map((s,i)=>{let v=effective("attendance",attendanceKey(s)).days||{},c=counts(s);return [i+1,s.name,...Array.from({length:n},(_,j)=>v[j+1]||""),c.H,c.S,c.I,c.A,c.absent,c.percent+"%"]})]),"CSV absensi")}}

  function attendanceRecap(){let selected=selectedClass?students().filter(x=>x.className===selectedClass):students();let list=selected.map((s,i)=>{let totals={H:0,S:0,I:0,A:0};let monthsToUse=selectedMonth===-1?Array.from({length:6},(_,j)=>selectedSemester==="Ganjil"?j+6:j):[selectedMonth];monthsToUse.forEach(m=>{let y=selectedMonth===-1?(selectedSemester==="Ganjil"?Number(settingsYear().slice(0,4))+(m<6?1:0):Number(settingsYear().slice(0,4))+1):selectedYear;let c=counts(s,m,y);Object.keys(totals).forEach(k=>totals[k]+=c[k])});let sum=Object.values(totals).reduce((a,b)=>a+b,0);return [i+1,s.name,totals.H,totals.S,totals.I,totals.A,sum?Math.round(totals.H/sum*100)+"%":"0%"]});return `${header("Rekapitulasi Absensi","Rekap dihitung dari absensi yang tersimpan, bukan angka contoh.")}<div class="panel no-print"><div class="toolbar">${selectedControls()}${choice("filter-month","Periode",[-1,...months.map((_,i)=>i)].map(String),String(selectedMonth))}<button id="recap-print" class="btn primary canva-button">Cetak / Simpan PDF</button><button id="recap-export" class="btn canva-button">Export CSV</button></div><p class="hint">Pilih -1 pada periode untuk rekap semester; bulan 0–11 mengikuti Januari–Desember.</p></div><section class="panel print-panel"><div class="doc">${schoolHead("REKAPITULASI ABSENSI SISWA",`KELAS ${selectedClass||"SEMUA"} · ${selectedMonth===-1?"SEMESTER "+selectedSemester:months[selectedMonth]+" "+selectedYear}`)}<div class="tablewrap"><table><thead><tr>${["No","Nama Siswa","Hadir","Sakit","Izin","Alpa","Persentase"].map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${list.length?list.map(r=>`<tr>${r.map((v,j)=>`<td class="${j===1?"name":""}">${esc(v)}</td>`).join("")}</tr>`).join(""):'<tr><td colspan="7">Belum ada siswa.</td></tr>'}</tbody></table></div>${signatures("attendance")}</div></section>`}

  function bindBackup(){$("#backup-history").textContent=history.length?history.join(" · "):"Belum ada backup pada sesi ini.";$("#backup-json").onclick=()=>{history.push(new Date().toLocaleString("id-ID"));showExport(JSON.stringify({format:"sdn-kesilir-02-v1",createdAt:new Date().toISOString(),records:rows.map(r=>({entity_type:r.entity_type,entity_key:r.entity_key,payload:r.payload,updated_at:r.updated_at}))},null,2),"Backup JSON");$("#backup-history").textContent=history.join(" · ")};$("#backup-csv").onclick=()=>showExport(csv([["entity_type","entity_key","payload","updated_at"],...rows.map(r=>[r.entity_type,r.entity_key,r.payload,r.updated_at])]),"CSV seluruh data");$("#restore-button").onclick=async()=>{let file=$("#restore-file").files?.[0];if(!file)return toast("Pilih file JSON terlebih dahulu.");let data;try{data=JSON.parse(await file.text())}catch(e){return toast("File bukan JSON yang valid.")}if(data.format!=="sdn-kesilir-02-v1"||!Array.isArray(data.records)||data.records.some(r=>!r.entity_type||!r.entity_key||typeof r.payload!=="string"))return toast("Format cadangan tidak sesuai.");if(data.records.length+rows.length>999)return toast("Jumlah data dapat melebihi batas 999 baris Canva Sheet.");confirmAction("Pulihkan cadangan?",`${data.records.length} entri akan ditambahkan atau diperbarui berdasarkan ID. Data lain tetap ada. Tindakan ini tidak dapat dibatalkan secara otomatis.`,async()=>{let success=0;for(let r of data.records){let obj;try{obj=JSON.parse(r.payload)}catch(e){toast("Ditemukan payload rusak; pemulihan dihentikan.");break}if(await write(r.entity_type,r.entity_key,obj,null))success++}toast(`${success} entri terkonfirmasi dipulihkan.`);render()})}}

  function parseCSV(text){let out=[],row=[],cell="",quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===","&&!quoted){row.push(cell);cell=""}else if((c==="\n"||c==="\r")&&!quoted){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cell);if(row.some(v=>v.trim()))out.push(row);row=[];cell=""}else cell+=c}row.push(cell);if(row.some(v=>v.trim()))out.push(row);return out}

  let quizTab="buat",quizDraft=null,quizFilter={},quizPackage=[],quizVersion="A",quizPaper="A4",quizLayout="portrait",quizPrintKind="student",quizAnswers={},quizStudent="",quizGradeId="",quizAutoExplain=true;

  function quizNew(){let s=settings();return {id:uid(),title:"Ulangan Harian",school:s.school,teacher:s.teacher,year:s.year,semester:s.semester,className:classes()[0]?.name||"",subjectId:subjects()[0]?._key||"",topic:"",objective:"",assessment:"Formatif",count:5,level:"Sedang",duration:60,instructions:"Jawablah setiap soal dengan teliti.",language:"Bahasa Indonesia",type:"Campuran",optionsCount:4,date:new Date().toISOString().slice(0,10),status:"Draft",questions:[]}}

  function quizForm(){let q=quizDraft||(quizDraft=quizNew());return `<section class="panel canva-panel no-print"><h2>Pengaturan ulangan</h2><div class="formgrid">${field("q-title","Judul ulangan",q.title)}${field("q-school","Nama sekolah",q.school)}${quizSelect("q-class","Kelas",classes().map(x=>x.name),q.className)}<div class="field"><label for="q-subject">Mata pelajaran</label><select id="q-subject">${subjects().map(s=>`<option value="${esc(s._key)}" ${q.subjectId===s._key?"selected":""}>${esc(s.name)}</option>`).join("")}</select></div>${field("q-teacher","Guru",q.teacher)}${field("q-year","Tahun pelajaran",q.year)}${quizSelect("q-semester","Semester",["Ganjil","Genap"],q.semester)}${field("q-date","Tanggal",q.date,"date")}${field("q-topic","Topik / materi wajib",q.topic)}${field("q-objective","Tujuan pembelajaran",q.objective)}${quizSelect("q-assessment","Jenis asesmen",["Formatif","Sumatif Harian","Sumatif Lingkup Materi","Sumatif Akhir Semester"],q.assessment)}${quizSelect("q-type","Bentuk soal",quizTypes,q.type)}${field("q-count","Jumlah soal",q.count,"number",'min="1" max="100"')}${quizSelect("q-level","Tingkat kesulitan",quizLevels,q.level)}${field("q-duration","Durasi (menit)",q.duration,"number",'min="1"')}${field("q-optionsCount","Opsi pilihan ganda",q.optionsCount,"number",'min="2" max="6"')}${quizSelect("q-language","Bahasa soal",["Bahasa Indonesia","English"],q.language)}<div class="field wide"><label for="q-instructions">Petunjuk pengerjaan</label><textarea id="q-instructions">${esc(q.instructions)}</textarea></div></div><div class="toolbar"><button id="q-generate" class="btn primary canva-button">Buat soal otomatis</button><button id="q-regenerate" class="btn canva-button">Buat ulang soal</button><label><input id="q-explain" type="checkbox" ${quizAutoExplain?"checked":""}> Sertakan pembahasan / indikator</label></div><p class="hint">Soal dibuat dari materi dan tujuan yang Anda isi menggunakan pola asesmen lokal; tinjau dan sesuaikan sebelum digunaka   function quizReadForm(){let q=quizDraft;for(let k of ["title","school","class","subject","teacher","year","semester","date","topic","objective","assessment","type","count","level","duration","optionsCount","language","instructions"]){let el=$("#q-"+k);if(el)q[({class:"className",subject:"subjectId"})[k]||k]=el.value}q.count=Number(q.count);q.duration=Number(q.duration);q.optionsCount=Number(q.optionsCount);quizAutoExplain=$("#q-explain")?.checked??quizAutoExplain}
  function quizQuestion(type,i,q){let topic=q.topic.trim(),goal=q.objective.trim(),en=q.language==="English",stem="";let variants=en?[`Which statement best describes ${topic}?`,`Give one example of ${topic} in everyday life.`,`What is the main purpose of studying ${topic}?`,`How can you apply ${topic} to solve a problem?`,`Explain the relationship between ${topic} and ${goal}.`]:[`Pernyataan manakah yang paling tepat tentang ${topic}?`,`Berikan satu contoh penerapan ${topic} dalam kehidupan sehari-hari.`,`Apa tujuan utama mempelajari ${topic}?`,`Bagaimana cara menerapkan ${topic} untuk menyelesaikan masalah?`,`Jelaskan hubungan antara ${topic} dan ${goal}.`];stem=variants[i%variants.length];let options=type==="Pilihan ganda"?Array.from({length:q.optionsCount},(_,j)=>j===0?(en?`An explanation consistent with ${topic} and ${goal}`:`Penjelasan yang sesuai dengan ${topic} dan ${goal}`):[en?`An unrelated idea about ${topic}`:`Pernyataan yang tidak berkaitan dengan ${topic}`,en?`A conclusion without supporting evidence`:`Kesimpulan tanpa bukti pendukung`,en?`An example contrary to ${goal}`:`Contoh yang bertentangan dengan ${goal}`,en?`An incomplete description`:`Penjelasan yang belum lengkap`,en?`An unsupported assumption`:`Dugaan tanpa dasar`][(j-1)%5]):type==="Benar/Salah"?["Benar","Salah"]:type==="Menjodohkan"?[`${topic} — ${goal}`,`${goal} — ${topic}`]:[];if(type==="Benar/Salah")stem=(en?`True or false: ${topic} is related to ${goal}.`:`Benar atau salah: ${topic} berkaitan dengan ${goal}.`);if(type==="Menjodohkan")stem=en?`Match the concept of ${topic} with its learning objective.`:`Jodohkan konsep ${topic} dengan tujuan pembelajarannya.`;return {id:uid(),number:i+1,type,stem,options,key:type==="Pilihan ganda"?"0":type==="Benar/Salah"?"Benar":type==="Menjodohkan"?"0":en?`A relevant answer about ${topic}`:`Jawaban yang relevan tentang ${topic}`,explanation:quizAutoExplain?(en?`Indicator: an accurate answer links ${topic} to ${goal}.`:`Indikator: jawaban tepat menghubungkan ${topic} dengan ${goal}.`):"",rubric:type==="Uraian"?`Ketepatan konsep ${topic} (60%), contoh atau alasan (40%).`:"",weight:1,level:q.level}}
  function quizValidate(q){if(!q.topic.trim())return "Materi wajib diisi sebelum generasi.";if(q.topic.trim().length<8||q.objective.trim().length<8)return "Materi dan tujuan pembelajaran terlalu singkat (minimal 8 karakter masing-masing).";if(!q.className||!q.subjectId)return "Tambahkan data kelas dan mata pelajaran terlebih dahulu.";if(!Number.isInteger(q.count)||q.count<1||q.count>100)return "Jumlah soal harus 1–100.";if(!Number.isInteger(q.optionsCount)||q.optionsCount<2||q.optionsCount>6)return "Jumlah opsi pilihan ganda harus 2–6.";if(!Number.isFinite(q.duration)||q.duration<1)return "Durasi harus lebih dari nol.";return ""}

  function quizEditQuestion(x,i){return `<article class="card quiz-question canva-card" data-qid="${esc(x.id)}"><h3>Soal ${i+1} <span class="quiz-badge">${esc(x.type)}</span></h3><div class="formgrid"><div class="field wide"><label for="qs-${i}">Teks soal</label><textarea id="qs-${i}" data-prop="stem">${esc(x.stem)}</textarea></div>${x.options.map((o,j)=>field(`qo-${i}-${j}`,`Opsi ${String.fromCharCode(65+j)}`,o)).join("")}<div class="field"><label for="qk-${i}">Kunci jawaban / indikator</label>${x.type==="Pilihan ganda"||x.type==="Menjodohkan"?`<select id="qk-${i}" data-prop="key">${x.options.map((o,j)=>`<option value="${j}" ${String(x.key)===String(j)?"selected":""}>${String.fromCharCode(65+j)}</option>`).join("")}</select>`:x.type==="Benar/Salah"?`<select id="qk-${i}" data-prop="key"><option ${x.key==="Benar"?"selected":""}>Benar</option><option ${x.key==="Salah"?"selected":""}>Salah</option></select>`:`<input id="qk-${i}" data-prop="key" value="${esc(x.key)}">`}</div>${field(`qw-${i}`,"Bobot",x.weight,"number",'min="0.01" step="0.01"')}${quizSelect(`ql-${i}`,"Kesulitan",quizLevels,x.level)}${field(`qn-${i}`,"Nomor urut",x.number,"number",'min="1"')}<div class="field wide"><label for="qe-${i}">Pembahasan / indikator jawaban</label><textarea id="qe-${i}" data-prop="explanation">${esc(x.explanation)}</textarea></div>${x.type==="Uraian"?`<div class="field wide"><label for="qr-${i}">Rubrik penilaian</label><textarea id="qr-${i}" data-prop="rubric">${esc(x.rubric)}</textarea></div>`:""}</div><div class="toolbar"><button class="btn canva-button q-duplicate" data-i="${i}">Duplikasi</button><button class="btn danger canva-button q-delete" data-i="${i}">Hapus soal</button></div></article>`}
  function quizCapture(){if(!quizDraft)return;quizReadForm();quizDraft.questions.forEach((x,i)=>{let el=$("#qs-"+i);if(!el)return;x.stem=el.value;x.options=x.options.map((o,j)=>$("#qo-"+i+"-"+j)?.value??o);x.key=$("#qk-"+i)?.value??x.key;x.weight=Number($("#qw-"+i)?.value);x.level=$("#ql-"+i)?.value||x.level;x.number=Number($("#qn-"+i)?.value)||i+1;x.explanation=$("#qe-"+i)?.value||"";if(x.type==="Uraian")x.rubric=$("#qr-"+i)?.value||""})}

  function quizPrint(kind,ab=false){quizCapture();let err=quizValidQuestions(quizDraft);if(err)return toast(err);let area=$("#quiz-print");area.innerHTML=ab?quizPaperHtml(quizDraft,kind,"A")+'<div class="printbreak"></div>'+quizPaperHtml(quizDraft,kind,"B"):quizPaperHtml(quizDraft,kind,quizVersion);area.style.display="block";document.body.classList.add("quiz-print-mode");let st=$("#quiz-page-style")||document.createElement("style");st.id="quiz-page-style";st.textContent=`@page{size:${quizPaper==="F4"?"21.5cm 33cm": "A4"} ${quizLayout};margin:1.5cm}`;document.head.appendChild(st);window.print();setTimeout(()=>{document.body.classList.remove("quiz-print-mode");st.remove()},800)}
  function bindQuiz(){document.querySelectorAll(".quiz-tab").forEach(b=>b.onclick=()=>{if(quizTab==="buat")quizCapture();quizTab=b.dataset.tab;render()});if(quizTab==="buat"){let q=quizDraft;$("#q-generate").onclick=()=>{quizCapture();let err=quizValidate(q);if(err)return toast(err);q.questions=Array.from({length:q.count},(_,i)=>quizQuestion(q.type==="Campuran"?quizTypes[i%5]:q.type,i,q));render();toast("Soal dibuat. Periksa fakta dan kunci sebelum diterbitkan.")};$("#q-regenerate").onclick=()=>confirmAction("Buat ulang soal?","Soal di editor akan diganti. Simpan sebelumnya bila ingin mempertahankannya.",async()=>{$("#q-generate").click()});$("#q-add").onclick=()=>{quizCapture();q.questions.push(quizQuestion(q.type==="Campuran"?"Pilihan ganda":q.type,q.questions.length,q));render()};$("#q-shuffle").onclick=()=>{quizCapture();q.questions=quizShuffle(q.questions).map((x,i)=>({...x,number:i+1}));render()};$("#q-shuffle-options").onclick=()=>{quizCapture();q.questions=quizShuffleOptions(q.questions);render()};document.querySelectorAll(".q-duplicate").forEach(b=>b.onclick=()=>{quizCapture();let i=Number(b.dataset.i),copy=JSON.parse(JSON.stringify(q.questions[i]));copy.id=uid();q.questions.splice(i+1,0,copy);q.questions.forEach((x,j)=>x.number=j+1);render()});document.querySelectorAll(".q-delete").forEach(b=>b.onclick=()=>confirmAction("Hapus soal?","Soal ini akan dihapus dari editor. Simpan kembali untuk memperbarui bank soal.",async()=>{quizCapture();q.questions.splice(Number(b.dataset.i),1);q.questions.forEach((x,j)=>x.number=j+1);render()}));async function saveQuiz(statusValue,button){quizCapture();let err=quizValidate(q)||quizValidQuestions(q);if(err)return toast(err);q.status=statusValue;let clean=JSON.parse(JSON.stringify(q));if(await write("quiz",q.id,clean,button))render()}$("#q-save").onclick=e=>saveQuiz("Draft",e.currentTarget);$("#q-publish").onclick=e=>saveQuiz("Siap Dicetak",e.currentTarget);["q-version","q-paper","q-layout"].forEach(id=>$("#"+id)?.addEventListener("change",e=>{quizCapture();quizVersion=$("#q-version").value;quizPaper=$("#q-paper").value;quizLayout=$("#q-layout").value;$("#quiz-print").innerHTML=quizPaperHtml(q,quizPrintKind,quizVersion)}));$("#q-preview-student")?.addEventListener("click",()=>{quizCapture();quizPrintKind="student";$("#quiz-print").innerHTML=quizPaperHtml(q,"student",quizVersion);$("#quiz-print").scrollIntoView({behavior:"smooth"})});$("#q-preview-key")?.addEventListener("click",()=>{quizCapture();quizPrintKind="key";$("#quiz-print").innerHTML=quizPaperHtml(q,"key",quizVersion);$("#quiz-print").scrollIntoView({behavior:"smooth"})});$("#q-print-student")?.addEventListener("click",()=>quizPrint("student"));$("#q-print-key")?.addEventListener("click",()=>quizPrint("key"));$("#q-print-ab")?.addEventListener("click",()=>quizPrint("student",true));$("#q-csv")?.addEventListener("click",()=>{quizCapture();showExport(csv([["Nomor","Jenis","Soal","Opsi","Kunci","Pembahasan","Rubrik","Bobot","Kesulitan"],...q.questions.map(x=>[x.number,x.type,x.stem,x.options.join(" | "),x.key,x.explanation,x.rubric,x.weight,x.level])]),"CSV bank soal")})}
    if(quizTab==="bank"){document.querySelectorAll('[id^="bf-"]').forEach(el=>el.onchange=()=>{quizFilter[el.id.slice(3)]=el.value;render()});document.querySelectorAll("[data-bank]").forEach(row=>{let key=row.dataset.bank,q=items("quiz").find(x=>x._key===key);row.querySelector(".qb-open").onclick=()=>{quizDraft=JSON.parse(JSON.stringify(q));delete quizDraft._key;delete quizDraft._record;quizTab="buat";render()};row.querySelector(".qb-copy").onclick=e=>{let obj=JSON.parse(JSON.stringify(q));delete obj._key;delete obj._record;obj.id=uid();obj.title+=" (Salinan)";obj.status="Draft";write("quiz",obj.id,obj,e.currentTarget).then(ok=>{if(ok)render()})};row.querySelector(".qb-archive").onclick=e=>{let obj=JSON.parse(JSON.stringify(q));delete obj._key;delete obj._record;obj.status=q.status==="Diarsipkan"?"Draft":"Diarsipkan";write("quiz",key,obj,e.currentTarget).then(ok=>{if(ok)render()})};row.querySelector(".qb-delete").onclick=()=>confirmAction("Hapus ulangan?","Dokumen dan seluruh soalnya akan dihapus dari bank. Tindakan ini tidak dapat dibatalkan.",async()=>{if(await remove("quiz",key))render()})})}
    if(quizTab==="paket"){document.querySelectorAll(".pk-check").forEach(el=>el.onchange=()=>{quizPackage=el.checked?[...new Set([...quizPackage,el.value])]:quizPackage.filter(id=>id!==el.value);$("#pk-build").textContent=`Buat paket dari pilihan (${quizPackage.length})`});$("#pk-clear").onclick=()=>{quizPackage=[];render()};$("#pk-auto").onclick=()=>{let pool=items("quiz").filter(q=>q.status!=="Diarsipkan"&&(!$("#pk-subject").value||q.subjectId===$("#pk-subject").value)&&(!$("#pk-topic").value||q.topic.toLowerCase().includes($("#pk-topic").value.toLowerCase()))).flatMap(q=>q.questions||[]).filter(x=>(!$("#pk-type").value||x.type===$("#pk-type").value)&&(!$("#pk-level").value||x.level===$("#pk-level").value));let n=Number($("#pk-count").value);if(!Number.isInteger(n)||n<1)return toast("Jumlah soal harus lebih dari nol.");quizPackage=[...new Set(quizShuffle(pool).map(x=>x.id))].slice(0,n);if(quizPackage.length<n)toast(`Hanya ${quizPackage.length} soal unik tersedia untuk kriteria ini.`);render()};$("#pk-build").onclick=()=>{let source=items("quiz").flatMap(q=>(q.questions||[]).map(x=>({q,x}))),picked=quizPackage.map(id=>source.find(s=>s.x.id===id)).filter(Boolean);if(!picked.length)return toast("Pilih minimal satu soal.");let base=quizNew();base.title="Paket Ulangan dari Bank Soal";base.subjectId=picked[0].q.subjectId;base.className=picked[0].q.className;base.topic=[...new Set(picked.map(p=>p.q.topic))].join(", ");base.objective=picked[0].q.objective;base.questions=picked.map((p,i)=>({...JSON.parse(JSON.stringify(p.x)),id:uid(),number:i+1}));base.count=base.questions.length;quizDraft=base;quizTab="buat";render();toast("Paket siap ditinjau. Paket B membalik urutan dan mengacak opsi dengan kunci tetap sesuai.")}}
    if(quizTab==="nilai"&&quizDraft?.questions?.length){$("#gr-student").onchange=e=>{quizStudent=e.target.value;quizAnswers={};let old=items("quiz_result").find(r=>r.quizId===quizDraft.id&&r.studentId===quizStudent);if(old)quizAnswers=old.answers||{};render()};$("#gr-calc").onclick=async e=>{let student=$("#gr-student").value;if(!student)return toast("Pilih siswa sebelum menilai.");let total=0,max=0;for(let [i,x] of quizDraft.questions.entries()){let answer=$("#ga-"+i).value,mark;if(["Pilihan ganda","Benar/Salah"].includes(x.type))mark=answer!==""&&answer===String(x.key)?Number(x.weight):0;else{let raw=$("#gm-"+i).value;if(raw==="")return toast(`Masukkan nilai manual soal ${i+1}, termasuk 0 jika belum benar.`);mark=Number(raw);if(!Number.isFinite(mark)||mark<0||mark>Number(x.weight))return toast(`Nilai manual soal ${i+1} harus antara 0 dan ${x.weight}.`)}quizAnswers[x.id]={answer,mark};total+=mark;max+=Number(x.weight)}let score=max?Math.round(total/max*10000)/100:0,rec={quizId:quizDraft.id,studentId:student,answers:quizAnswers,score,date:new Date().toISOString()};let ok=await write("quiz_result",quizDraft.id+"|"+student,rec,e.currentTarget);if(ok)$("#gr-result").textContent=`Nilai ${score}/100 (${total}/${max} poin) tersimpan. Periksa sebelum mengirim ke Daftar Nilai.`};$("#gr-send").onclick=()=>{let student=$("#gr-student").value,result=payload("quiz_result",quizDraft.id+"|"+student);if(!student||!result)return toast("Simpan penilaian siswa terlebih dahulu.");quizGradeId=$("#gr-component").value;confirmAction("Kirim nilai akhir?",`Nilai ${result.score} akan dimasukkan ke komponen Daftar Nilai Siswa. Nilai lama pada komponen tersebut akan diganti.`,async()=>{let q=quizDraft,oldClass=selectedClass,oldSubject=selectedSubject,oldSemester=selectedSemester;selectedClass=q.className;selectedSubject=q.subjectId;selectedSemester=q.semester;let s=students().find(x=>x._key===student),key=[student,q.className,q.subjectId,q.year,q.semester].join("|");selectedClass=oldClass;selectedSubject=oldSubject;selectedSemester=oldSemester;let v=effective("grade",key),values={...(v.values||{}),[quizGradeId]:result.score};await write("grade",key,{...v,studentId:student,className:q.className,subjectId:q.subjectId,schoolYear:q.year,semester:q.semester,values,note:v.note||""},null)})}}
  }
  function render(){if(!ready)return;nav();let html="",bind=()=>{};switch(page){case"dashboard":html=dashboard();break;case"students":case"teachers":case"classes":case"subjects":html=crudPage(page);bind=()=>bindCrud(page);break;case"attendance":html=attendance();bind=bindAttendance;break;case"attendanceRecap":html=attendanceRecap();bind=bindAttendanceRecap;break;case"grades":html=gradePage();bind=bindGrade;break;case"quiz":html=quizPage();bind=bindQuiz;break;case"components":html=componentsPage();bind=bindComponents;break;case"gradeRecap":html=gradeRecap();bind=bindGradeRecap;break;case"settings":html=settingsPage();bind=bindSettings;break;case"printing":html=printPage();bind=bindPrint;break;case"backup":html=backupPage();bind=bindBackup}$("#main").innerHTML=html;bind();icons()}
  $("#navigation").addEventListener("click",e=>{let b=e.target.closest("[data-page]");if(!b)return;page=b.dataset.page;filter="";editing=null;$("#sidebar").classList.remove("open");render()});
  $("#mobile-menu").onclick=()=>$("#sidebar").classList.toggle("open");
  init();
})();
